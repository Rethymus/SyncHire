name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '22.x'
  PYTHON_VERSION: '3.11'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Run linter
        run: npm run lint --workspace=frontend

      - name: Run type check
        run: npm run type-check --workspace=frontend

      - name: Run tests
        run: npm run test --workspace=frontend -- --run

      - name: Build
        run: npm run build --workspace=frontend
        env:
          NODE_ENV: production

  frontend-e2e-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python for lite backend
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install frontend dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Install lite backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements_lite.txt

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: Start lite backend
        run: |
          nohup python api/main_lite.py > /tmp/lite-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/resumes > /dev/null 2>&1; then
              echo "lite backend ready"; exit 0
            fi
            sleep 2
          done
          echo "lite backend failed to start"; cat /tmp/lite-api.log; exit 1

      - name: Run e2e tests (full suite)
        run: npx playwright test
        working-directory: ./frontend

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: frontend/playwright-report/
          retention-days: 7

  static-export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Build GitHub Pages export
        run: npm run build:pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify export artifacts
        run: |
          test -f frontend/out/index.html || { echo "missing out/index.html"; exit 1; }
          test -f frontend/out/dashboard/index.html || { echo "missing dashboard route"; exit 1; }
          test -f frontend/out/sw.js || { echo "missing service worker"; exit 1; }
          test -f frontend/out/manifest.webmanifest || { echo "missing manifest"; exit 1; }
          grep -q 'rel="manifest"' frontend/out/index.html || { echo "manifest link not injected"; exit 1; }
          grep -q 'Content-Security-Policy' frontend/out/index.html || { echo "CSP meta not injected"; exit 1; }
          echo "static export verified"

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: synchire
          POSTGRES_PASSWORD: synchire_test
          POSTGRES_DB: synchire_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linter
        run: |
          black --check .
          ruff check .

      - name: Run tests
        run: |
          python -m pytest tests/test_api.py::TestHealthEndpoints tests/test_lite_local_first_domain.py tests/test_lite_contract_drift.py -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://synchire:synchire_test@localhost:5432/synchire_test
          REDIS_URL: redis://localhost:6379
          TEST_MODE: true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit security scan
        working-directory: ./api
        run: |
          bandit -r app/ -f json -o bandit-report.json || true

      - name: Run dependency audit
        working-directory: ./api
        run: pip-audit -r requirements-dev.txt --format json --output pip-audit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-reports
          path: |
            api/bandit-report.json
            api/pip-audit-report.json

  quality-gate:
    needs: [frontend-tests, frontend-e2e-smoke, static-export, backend-tests, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "✅ All quality checks passed successfully!"

      - name: Create summary
        run: |
          echo "## ✅ CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ✅ Built and tested successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ✅ Tested with database" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ✅ Scanned for vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ✅ All linting checks passed" >> $GITHUB_STEP_SUMMARY
