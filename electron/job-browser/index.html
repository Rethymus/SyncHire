<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data:; connect-src http://127.0.0.1:* http://localhost:*" />
  <title>SyncHire 求职浏览器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; flex-direction: column; height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f8fafc; color: #111827; overflow: hidden;
    }
    header {
      display: flex; gap: 8px; padding: 8px 12px; align-items: center;
      background: #fff; border-bottom: 1px solid #e5e7eb;
    }
    header .brand { font-weight: 700; color: #4f46e5; white-space: nowrap; }
    #url-form { flex: 1; display: flex; gap: 6px; }
    #url-input {
      flex: 1; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 13px;
    }
    button {
      padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px;
      background: #fff; font-size: 13px; cursor: pointer;
    }
    button:hover { background: #f3f4f6; }
    button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    button.primary:hover { background: #4338ca; }
    button:disabled { opacity: 0.5; cursor: default; }
    main { flex: 1; display: flex; min-height: 0; }
    #page-wrap { flex: 1; min-width: 0; background: #fff; position: relative; }
    webview { width: 100%; height: 100%; border: none; display: flex; }
    aside {
      width: 340px; flex-shrink: 0; border-left: 1px solid #e5e7eb;
      background: #fff; display: flex; flex-direction: column; min-height: 0;
    }
    aside .panel-head {
      padding: 10px 14px; border-bottom: 1px solid #e5e7eb;
    }
    aside .panel-head h2 { font-size: 14px; margin-bottom: 4px; }
    aside .panel-head p { font-size: 12px; color: #6b7280; line-height: 1.4; }
    #fields {
      flex: 1; overflow-y: auto; padding: 10px 14px; display: flex;
      flex-direction: column; gap: 10px;
    }
    .field-card {
      border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .field-card.needs-review { border-color: #f59e0b; background: #fffbeb; }
    .field-card.filled { border-color: #10b981; background: #ecfdf5; }
    .field-card .meta {
      display: flex; justify-content: space-between; gap: 8px; font-size: 12px;
    }
    .field-card .meta .label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .field-card .meta .kind { color: #6b7280; flex-shrink: 0; font-family: monospace; }
    .field-card .row { display: flex; gap: 6px; }
    .field-card input {
      flex: 1; padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 5px;
      font-size: 12px; min-width: 0;
    }
    .status-note { font-size: 11px; color: #6b7280; }
    .empty-state { color: #6b7280; font-size: 13px; padding: 24px 8px; text-align: center; }
    .footer-note {
      padding: 8px 14px; border-top: 1px solid #e5e7eb; font-size: 11px;
      color: #6b7280; background: #f9fafb;
    }
    #panel-actions { padding: 10px 14px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; }
    #panel-actions button { flex: 1; }
  </style>
</head>
<body>
  <header>
    <span class="brand">SyncHire 求职浏览器</span>
    <form id="url-form">
      <input id="url-input" type="url" placeholder="https://…" aria-label="网址" />
      <button type="submit">前往</button>
    </form>
  </header>

  <main>
    <div id="page-wrap">
      <!-- persist partition keeps ATS login cookies across sessions -->
      <webview id="webview" partition="persist:synchire-jobs" allowpopups="on"
               useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36">
      </webview>
    </div>

    <aside>
      <div class="panel-head">
        <h2>填表助手</h2>
        <p>检测到的表单字段如下，可编辑后填充。<b>不会自动提交表单</b>——填充后请人工检查并提交。</p>
      </div>
      <div id="panel-actions">
        <button type="button" id="detect-btn">检测表单</button>
        <button type="button" id="fill-all-btn" class="primary">全部填充</button>
        <button type="button" id="log-apply-btn">✓ 记录投递</button>
      </div>
      <div id="fields">
        <div class="empty-state">打开任意网申页面后点击「检测表单」</div>
      </div>
      <div class="footer-note">
        值来自本地 SyncHire 档案（可在「角色卡/档案」页维护）。自定义下拉等控件会标记为需人工处理。
      </div>
    </aside>
  </main>

  <script src="fill-engine.iife.js"></script>
  <script src="panel.js"></script>
</body>
</html>
