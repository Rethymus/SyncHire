<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SyncHire 填表引擎测试表单</title>
  <style>
    /* 最小样式：单列布局，保证人工与自动化检查时可读即可 */
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 24px auto; max-width: 560px; color: #111827; }
    h1 { font-size: 18px; margin-bottom: 6px; }
    .hint { font-size: 12px; color: #6b7280; margin-bottom: 18px; line-height: 1.5; }
    fieldset { border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 20px; padding: 14px 18px; }
    legend { font-weight: 700; padding: 0 6px; font-size: 14px; }
    .field-row { display: flex; flex-direction: column; margin-bottom: 10px; }
    .field-row > label { font-size: 13px; margin-bottom: 4px; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="url"], select, textarea {
      padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; font-family: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    .choice-group { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
    .choice-group > .group-label { font-weight: 600; }
    .choice-group label { display: inline-flex; gap: 4px; align-items: center; }
    input[type="submit"] {
      padding: 8px 18px; border: 1px solid #4f46e5; border-radius: 6px;
      background: #4f46e5; color: #fff; font-size: 14px; cursor: pointer;
    }
    #submit-status { margin-left: 12px; font-size: 13px; color: #10b981; visibility: hidden; }
  </style>
</head>
<body>
  <h1>填表引擎测试表单</h1>
  <p class="hint">
    静态自包含测试页（file:// 直接打开，无外部依赖），覆盖中英文网申的典型字段。
    底部的提交按钮（type=submit）必须被填表引擎的检测忽略——引擎绝不自动提交表单。
  </p>

  <form id="application-form" action="#" method="post">
    <fieldset>
      <legend>中文网申字段</legend>

      <div class="field-row">
        <label for="zh-name">姓名</label>
        <input type="text" id="zh-name" name="name" placeholder="请输入真实姓名" />
      </div>

      <div class="field-row">
        <label for="zh-email">邮箱</label>
        <input type="email" id="zh-email" name="email" placeholder="name@example.com" />
      </div>

      <div class="field-row">
        <label for="zh-phone">手机号</label>
        <input type="tel" id="zh-phone" name="phone" placeholder="13800000000" />
      </div>

      <div class="choice-group">
        <span class="group-label">性别</span>
        <label><input type="radio" name="gender" value="male" /> 男</label>
        <label><input type="radio" name="gender" value="female" /> 女</label>
        <label><input type="radio" name="gender" value="secret" /> 保密</label>
      </div>

      <div class="field-row">
        <label for="zh-education">学历</label>
        <select id="zh-education" name="education">
          <option value="">请选择</option>
          <option value="high_school">高中</option>
          <option value="associate">大专</option>
          <option value="bachelor">本科</option>
          <option value="master">硕士</option>
          <option value="doctorate">博士</option>
        </select>
      </div>

      <div class="field-row">
        <label for="zh-salary">期望薪资</label>
        <input type="text" id="zh-salary" name="salary" placeholder="如：25k-35k" />
      </div>

      <div class="field-row">
        <label for="zh-summary">自我介绍</label>
        <textarea id="zh-summary" name="self_introduction" placeholder="简要介绍教育背景、技能与项目经历"></textarea>
      </div>

      <div class="choice-group">
        <label for="zh-agree">
          <input type="checkbox" id="zh-agree" name="agree_terms" /> 我已阅读并同意招聘条款与隐私政策
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>English Fields</legend>

      <div class="field-row">
        <label for="en-name">Full Name</label>
        <input type="text" id="en-name" name="full_name" />
      </div>

      <div class="field-row">
        <label for="en-email">Email</label>
        <input type="email" id="en-email" name="email_address" />
      </div>

      <div class="field-row">
        <label for="en-phone">Phone</label>
        <input type="tel" id="en-phone" name="phone_number" />
      </div>

      <div class="field-row">
        <label for="en-linkedin">LinkedIn URL</label>
        <input type="url" id="en-linkedin" name="linkedin" placeholder="https://www.linkedin.com/in/…" />
      </div>
    </fieldset>

    <!-- ATS 网申常见形态：表单嵌在 iframe 里。srcdoc 在 file:// 下继承父源，
         引擎必须穿透检测并填充。内嵌 3 个可填字段（姓氏/证件类型 select/证件号码）
         + 一个提交按钮（同样必须被“绝不提交”约束忽略）。label 在 iframe 文档内
         通过 label[for] 关联，用于验证 label 解析不跨框架边界。 -->
    <fieldset>
      <legend>iframe 内嵌表单（same-origin srcdoc 穿透）</legend>

      <iframe
        id="embedded-frame"
        title="同源内嵌表单（srcdoc 继承父源）"
        style="width: 100%; height: 240px; border: 1px solid #e5e7eb; border-radius: 6px;"
        srcdoc="<!doctype html>
<html lang='zh-CN'>
<head><meta charset='utf-8' />
<style>
  body { font-family: system-ui, sans-serif; margin: 10px; font-size: 13px; color: #111827; }
  .field-row { display: flex; flex-direction: column; margin-bottom: 10px; }
  .field-row > label { font-size: 13px; margin-bottom: 4px; }
  input[type='text'], select { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; width: 200px; }
  input[type='submit'] { padding: 8px 18px; border: 1px solid #4f46e5; border-radius: 6px; background: #4f46e5; color: #fff; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
  <form id='iframe-inner-form' action='#' onsubmit='return false'>
    <div class='field-row'>
      <label for='if-last-name'>姓氏</label>
      <input type='text' id='if-last-name' name='last_name' />
    </div>
    <div class='field-row'>
      <label for='if-id-type'>证件类型</label>
      <select id='if-id-type' name='id_type'>
        <option value=''>请选择</option>
        <option value='id_card'>身份证</option>
        <option value='passport'>护照</option>
      </select>
    </div>
    <div class='field-row'>
      <label for='if-id-number'>证件号码</label>
      <input type='text' id='if-id-number' name='id_number' />
    </div>
    <input type='submit' id='if-submit' name='iframe_submit' value='iframe 内提交（必须被忽略）' />
  </form>
</body>
</html>"></iframe>

      <!-- 跨源对照：沙箱 iframe（无 allow-same-origin）拥有唯一源，即使内容来自
           srcdoc 也对父文档跨源，contentDocument 为 null。其中的字段必须被引擎
           静默跳过，且不得让整个检测崩溃。 -->
      <iframe
        id="cross-origin-frame"
        title="跨源（沙箱唯一源）内嵌表单，应被静默跳过"
        sandbox=""
        style="width: 100%; height: 0; border: 0;"
        srcdoc="<form><input type='text' name='sandboxed_field' /><input type='submit' name='sandboxed_submit' /></form>"></iframe>
    </fieldset>

    <!-- 引擎检测必须忽略的提交控件：input[type=submit] 在 FILLABLE_SELECTOR
         命中范围内，是“绝不提交”约束的真正边界用例 -->
    <input type="submit" id="submit-btn" name="submit" value="提交申请 Submit Application" />
    <span id="submit-status">已拦截：测试页不会真的提交</span>
  </form>

  <script>
    // 引擎本身不会触碰提交控件；这里的拦截只是防止人工验证时误点导致页面跳转。
    document.getElementById('application-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('submit-status').style.visibility = 'visible';
    });
  </script>
</body>
</html>
